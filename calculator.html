<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table width="40px" style="background-color: black; border-radius: 20px; margin:auto">
        <tr>
            <td colspan="4" style="text-align: center;"><input placeholder="Welcome to Calculator"></td>
        </tr>
        <tr>
            <td style="color: white; text-align: right;" colspan="4">0</td>
        </tr>
        <tr>
            <td ><input type="button" value="AC" style="width:40px; height:40px; border-radius:50% ; background-color:gray;"></td>
            <td><input type="button" value="⌫" style="width: 40px; height: 40px; border-radius:50% ;background-color: gray"></td>
            <td><input type="button" value="%" style="width: 40px; height: 40px; border-radius:50% ;background-color: gray;"></td>
            <td><input type="button" value="÷" style="width: 40px; height: 40px; border-radius:50% ;background-color: orange;"></td>
        </tr>
        <tr>
            <td><input type="button" value="7" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="8" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="9" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="×" style="width: 40px; height: 40px; border-radius:50% ;background-color: orange;"></td>
        </tr>
        <tr>
            <td><input type="button" value="4" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="5" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="6" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="−" style="width: 40px; height: 40px; border-radius:50% ;background-color: orange;"></td>
        </tr>
        <tr>
            <td><input type="button" value="1" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="2" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="3" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="+" style="width: 40px; height: 40px; border-radius:50% ;background-color: orange;"></td>
        </tr>
        <tr>
            <td><input type="button" value="0" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="00" style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="." style="width: 40px; height: 40px; border-radius:50% ;"></td>
            <td><input type="button" value="=" style="width: 40px; height: 40px; border-radius:50% ;background-color: orange;"></td>
        </tr>
    </table>
</body>
</html>
